name: Package namespace migration

on:
  push:
    branches:
      - feature/flutter-ide-transition
    paths:
      - .github/workflows/package-namespace-migration.yml
      - scripts/migrate_package_namespace.py

permissions:
  contents: write

concurrency:
  group: flutteride-package-migration
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - name: Validate migration script syntax
        run: python3 -m py_compile scripts/migrate_package_namespace.py
      - name: Apply namespace migration
        run: python3 scripts/migrate_package_namespace.py
      - name: Install debug development keystore
        run: |
          mkdir -p build/signing
          base64 --decode core/app/debug-dev-keystore.jks.base64 > build/signing/signing-key.jks
          keytool -list -keystore build/signing/signing-key.jks -storepass android -alias androiddebugkey
      - name: Build and test migrated project
        run: |
          chmod +x ./gradlew
          ./gradlew :core:app:assembleDebug :core:app:testDebugUnitTest :editor:impl:testDebugUnitTest --no-daemon --stacktrace
        env:
          IDE_SIGNING_ALIAS: androiddebugkey
          IDE_SIGNING_STORE_PASS: android
          IDE_SIGNING_KEY_PASS: android
          ANDROIDIDE_TEST: "true"
      - name: Commit verified migration
        run: |
          if git diff --quiet && git diff --cached --quiet; then
            echo "No migration changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Migrate package namespace to org.techwithkaushik.flutteride"
          git push origin HEAD:feature/flutter-ide-transition
