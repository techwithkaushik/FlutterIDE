name: FlutterIDE baseline CI

on:
  push:
    branches:
      - feature/flutter-ide-transition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutteride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build existing Android host (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install repository debug development keystore
        run: |
          test -s core/app/debug-dev-keystore.jks.base64
          mkdir -p build/signing
          base64 --decode core/app/debug-dev-keystore.jks.base64 > build/signing/signing-key.jks
          keytool -list -keystore build/signing/signing-key.jks \
            -storepass android -alias androiddebugkey

      - name: Assemble debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon --stacktrace
        env:
          IDE_SIGNING_ALIAS: androiddebugkey
          IDE_SIGNING_STORE_PASS: android
          IDE_SIGNING_KEY_PASS: android

      - name: Verify split APK outputs
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk_dir="core/app/build/outputs/apk/debug"
          expected=(
            "app-arm64-v8a-debug.apk"
            "app-armeabi-v7a-debug.apk"
            "app-x86_64-debug.apk"
          )
          for apk_name in "${expected[@]}"; do
            apk="$apk_dir/$apk_name"
            if [[ ! -s "$apk" ]]; then
              echo "::error::Expected split APK not found: $apk"
              echo "Available APK outputs:"
              find core/app/build/outputs/apk -type f -name '*.apk' -print || true
              exit 1
            fi
            printf 'Found %s (%s)\n' "$apk" "$(du -h "$apk" | cut -f1)"
          done

      - name: Upload arm64-v8a APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-debug-arm64-v8a
          path: core/app/build/outputs/apk/debug/app-arm64-v8a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload armeabi-v7a APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-debug-armeabi-v7a
          path: core/app/build/outputs/apk/debug/app-armeabi-v7a-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

      - name: Upload x86_64 APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-debug-x86_64
          path: core/app/build/outputs/apk/debug/app-x86_64-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:app:testDebugUnitTest :editor:impl:testDebugUnitTest --no-daemon --stacktrace
        env:
          ANDROIDIDE_TEST: "true"
