name: FlutterIDE baseline CI

on:
  push:
    branches:
      - feature/flutter-ide-transition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutteride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build existing Android host (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Install repository debug development keystore
        run: |
          test -s core/app/debug-dev-keystore.jks.base64
          mkdir -p build/signing
          base64 --decode core/app/debug-dev-keystore.jks.base64 > build/signing/signing-key.jks
          keytool -list -keystore build/signing/signing-key.jks \
            -storepass android -alias androiddebugkey

      - name: Assemble debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon --stacktrace
        env:
          IDE_SIGNING_ALIAS: androiddebugkey
          IDE_SIGNING_STORE_PASS: android
          IDE_SIGNING_KEY_PASS: android

      - name: Verify debug APK output
        if: success()
        shell: bash
        run: |
          set -euo pipefail
          apk="core/app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk" || {
            echo "::error::Expected debug APK was not generated at $apk"
            find core/app/build/outputs/apk -type f -name '*.apk' -print || true
            exit 1
          }
          echo "APK_PATH=$apk" >> "$GITHUB_ENV"
          echo "APK_SIZE_BYTES=$(stat -c '%s' "$apk")" >> "$GITHUB_ENV"

      - name: Upload debug APK as its own artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-host-debug-apk
          path: core/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          compression-level: 0
          retention-days: 7

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:app:testDebugUnitTest :editor:impl:testDebugUnitTest --no-daemon --stacktrace
        env:
          ANDROIDIDE_TEST: "true"
