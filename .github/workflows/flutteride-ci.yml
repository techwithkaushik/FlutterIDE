name: FlutterIDE baseline CI

on:
  push:
    branches:
      - feature/flutter-ide-transition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutteride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build existing Android host (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Use local debug signing for CI
        run: printf 'ide.build.fdroid=true\nide.build.fdroid.version=v2.7.1-beta\nide.build.fdroid.vercode=1\n' > fdroid.properties

      - name: Assemble debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon --stacktrace

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-host-debug-apk
          path: core/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew runTestsInCI --continue --exclude-task :testing:androidTest:compileDebugKotlin --no-daemon --stacktrace
        env:
          ANDROIDIDE_TEST: "true"
