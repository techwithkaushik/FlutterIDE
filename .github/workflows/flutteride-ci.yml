name: FlutterIDE baseline CI

on:
  push:
    branches:
      - feature/flutter-ide-transition
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: flutteride-ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-debug:
    name: Build existing Android host (baseline)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Use repository debug development keystore
        run: |
          test -s core/app/dev.keystore
          mkdir -p build/signing
          cp core/app/dev.keystore build/signing/signing-key.jks
          keytool -list -keystore build/signing/signing-key.jks -storepass android -alias androiddebugkey

      - name: Assemble debug APK
        run: ./gradlew :core:app:assembleDebug --no-daemon --stacktrace
        env:
          IDE_SIGNING_ALIAS: androiddebugkey
          IDE_SIGNING_STORE_PASS: android
          IDE_SIGNING_KEY_PASS: android

      - name: Upload debug APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: flutteride-host-debug-apk
          path: core/app/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 7

  unit-tests:
    name: Run unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle wrapper executable
        run: chmod +x ./gradlew

      - name: Run unit tests
        run: ./gradlew :core:app:testDebugUnitTest :editor:impl:testDebugUnitTest --no-daemon --stacktrace
        env:
          ANDROIDIDE_TEST: "true"
